<!DOCTYPE html>
<html>

<head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Countdown to AbutiBaby ❤️</title>
        <style>

        body {
           background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            color: #6b3a4a;
        }

        h1 {
            font-size: 40px;
            color: #d66b8c;
        }

        h2 {
            font-size: 24px;
            font-weight: normal;
        }
                #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .time-box {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            min-width: 80px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .time-box {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            min-width: 80px;
            box-shadow: 0 6px 15px rgba(214, 107, 140, 0.2);
            border: 2px solid #ffd6e3;
}

        .time-box span {
            display: block;
            font-size: 36px;
            font-weight: bold;
            color: #d66b8c;

        
}
        .love-message {
            margin-top: 35px;
            font-size: 20px;
            color: #d66b8c;
            font-style: italic;
        }

        .hearts {
            color: #e89ab3;
            font-size: 24px;
            margin: 15px 0;
            letter-spacing: 8px;
        }
                .date-text {
            font-size: 18px;
            color: #b84d73;
            font-weight: bold;
            margin-top: 5px;
        }

    </style>
</head>

<body>
        <h1>💕 Hey Abuti Baby! 💕</h1>

    <h2>Countdown until I see you!</h2>
    <p class="date-text">18 November 2026 ❤️</p>
    <div class="hearts">♡ ♥ ♡ ♥ ♡</div>

    <div id="countdown">

        <div class="time-box">
            <span id="days">0</span>
            <small>Days</small>
        </div>

        <div class="time-box">
            <span id="hours">0</span>
            <small>Hours</small>
        </div>

        <div class="time-box">
            <span id="minutes">0</span>
            <small>Minutes</small>
        </div>

        <div class="time-box">
            <span id="seconds">0</span>
            <small>Seconds</small>
        </div>
        
        <p class="love-message">
        
       </p>


    </div>
        <script>

        const countdownDate = new Date("November 18, 2026 00:00:00").getTime();

        const countdown = setInterval(function () {

            const now = new Date().getTime();

            const distance = countdownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((distance / (1000 * 60)) % 60);
            const seconds = Math.floor((distance / 1000) % 60);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

        }, 1000);

    </script>

</body>

</html>
